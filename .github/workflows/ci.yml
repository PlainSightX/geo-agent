# CI：lint + 单元测试。不启动数据库、不调用任何模型 API（集成测试会自动跳过）。
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: unit tests (no DB, no API key)
        env:
          GEO_AGENT_DSN: postgresql://none:none@127.0.0.1:1/none
          DEEPSEEK_API_KEY: ""
        run: uv run pytest -q
