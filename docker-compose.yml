# 数据库服务：第一轮用 postgis/postgis:16-3.5（digest 94146ac3…），
# 第二轮改为 docker/db.Dockerfile 构建的镜像：pgrouting/pgrouting:16-3.5-3.8.0（固定 digest）+ pgvector 0.8.6（固定 deb sha256）。
# 两者的 PostgreSQL 16.9 / PostGIS 3.5.2 完全相同，复用同一个数据卷；第一轮金标在新镜像上逐题复现（freeze_gold.py --check）。
services:
  db:
    build:
      context: ./docker
      dockerfile: db.Dockerfile
    image: geo-agent-db:r2
    container_name: geo-agent-db
    environment:
      POSTGRES_USER: geo_admin
      POSTGRES_PASSWORD: geo_admin_local_only
      POSTGRES_DB: geo
    ports:
      - "127.0.0.1:55442:5432"
    volumes:
      - geo_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_admin -d geo"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  geo_pgdata:
