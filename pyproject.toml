[project]
name = "geo-agent"
version = "0.1.0"
description = "LangGraph spatial agent over PostGIS (Nanjing OSM) with a pre-registered text-to-SQL evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.3",
    "langgraph==1.2.16",
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "openai==3.35.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "sqlglot==30.23.0",
    "tokenizers==0.23.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_agent"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires the local PostGIS container (skipped when unavailable)"]
